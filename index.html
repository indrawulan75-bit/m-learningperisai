<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-LEARNING PERISAI</title>
  <!-- Mengimpor Tailwind CSS untuk styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Mengimpor React dan ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Mengimpor Babel untuk kompilasi JSX di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0f172a]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- KOMPONEN IKON (Menggantikan lucide-react agar berjalan mandiri di HTML) ---
    const IconBase = ({ children, size = 24, className = '', color = 'currentColor' }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    const Play = (props) => <IconBase {...props}><polygon points="5 3 19 12 5 21 5 3"></polygon></IconBase>;
    const ArrowRight = (props) => <IconBase {...props}><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></IconBase>;
    const ArrowLeft = (props) => <IconBase {...props}><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></IconBase>;
    const BookOpen = (props) => <IconBase {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></IconBase>;
    const LayoutGrid = (props) => <IconBase {...props}><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></IconBase>;
    const ListOrdered = (props) => <IconBase {...props}><line x1="10" y1="6" x2="21" y2="6"></line><line x1="10" y1="12" x2="21" y2="12"></line><line x1="10" y1="18" x2="21" y2="18"></line><path d="M4 6h1v4"></path><path d="M4 10h2"></path><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path></IconBase>;
    const Target = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></IconBase>;
    const HelpCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></IconBase>;
    const User = (props) => <IconBase {...props}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></IconBase>;
    const Home = (props) => <IconBase {...props}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></IconBase>;
    const CheckCircle = (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></IconBase>;
    const XCircle = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></IconBase>;
    const RotateCcw = (props) => <IconBase {...props}><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></IconBase>;
    // Ikon Volume untuk Musik
    const Volume2 = (props) => <IconBase {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></IconBase>;
    const VolumeX = (props) => <IconBase {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></IconBase>;
    // Ikon Fullscreen
    const Maximize = (props) => <IconBase {...props}><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></IconBase>;
    const Minimize = (props) => <IconBase {...props}><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></IconBase>;
    const Bookmark = (props) => <IconBase {...props}><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></IconBase>;

    // --- KOMPONEN BUTTON (Dikeluarkan agar stabil) ---
    const Button = ({ onClick, children, icon: Icon, variant = 'primary', className = '' }) => {
      const baseStyle = "flex items-center justify-center gap-2 px-6 py-3 rounded-full font-bold transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-lg";
      const variants = {
        primary: "bg-gradient-to-r from-blue-500 to-indigo-600 text-white hover:shadow-blue-500/50",
        secondary: "bg-white/10 backdrop-blur-md border border-white/20 text-white hover:bg-white/20",
        accent: "bg-gradient-to-r from-pink-500 to-purple-600 text-white hover:shadow-pink-500/50",
        success: "bg-green-500 text-white hover:bg-green-600",
        outline: "border-2 border-indigo-400 text-indigo-100 hover:bg-indigo-400/20"
      };

      return (
        <button onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`}>
          {Icon && <Icon size={20} />}
          {children}
        </button>
      );
    };

    // --- KOMPONEN HALAMAN LOGIN (Dikeluarkan agar tidak re-render ulang setiap ketikan) ---
    const HalamanLogin = ({ namaPeserta, setNamaPeserta, asalSekolah, setAsalSekolah, navigate }) => {
      const handleLogin = (e) => {
        e?.preventDefault();
        if(namaPeserta.trim() && asalSekolah.trim()) {
          navigate('pengantar'); // Mengarahkan ke halaman pengantar setelah login
        }
      };

      return (
        <React.Fragment>
          <div
            className="fixed inset-0 z-[-1] bg-cover bg-center bg-no-repeat"
            style={{ backgroundImage: 'url("https://i.imgur.com/IdXVYlk.png")' }}
          >
            <div className="absolute inset-0 bg-[#0f172a]/20"></div>
          </div>
          <div className="flex flex-col items-center justify-center h-full max-w-md mx-auto px-4 relative z-10">
            <div className="bg-white/10 backdrop-blur-lg border border-white/20 p-8 rounded-3xl shadow-2xl w-full text-center">
              <div className="bg-blue-500/20 w-24 h-24 mx-auto rounded-full flex items-center justify-center mb-6">
                <User size={48} className="text-blue-400" />
              </div>
              <h2 className="text-3xl font-bold text-white mb-2">Login Peserta</h2>
              <p className="text-indigo-100 mb-8">Silakan masukkan nama dan asal sekolah Anda sebelum masuk ke menu utama.</p>
             
              <form onSubmit={handleLogin} className="flex flex-col gap-4">
                <input
                  type="text"
                  placeholder="Masukkan Nama Anda..."
                  value={namaPeserta}
                  onChange={(e) => setNamaPeserta(e.target.value)}
                  className="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-4 text-white placeholder-white/50 focus:outline-none focus:border-blue-500 transition-colors text-center text-lg font-medium"
                  required
                />
                <input
                  type="text"
                  placeholder="Masukkan Asal Sekolah..."
                  value={asalSekolah}
                  onChange={(e) => setAsalSekolah(e.target.value)}
                  className="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-4 text-white placeholder-white/50 focus:outline-none focus:border-blue-500 transition-colors text-center text-lg font-medium"
                  required
                />
                <button
                  type="submit"
                  className="flex items-center justify-center gap-2 px-6 py-4 rounded-full font-bold transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-lg bg-gradient-to-r from-blue-500 to-indigo-600 text-white hover:shadow-blue-500/50 w-full mt-2"
                >
                  Simpan dan Lanjut <ArrowRight size={20} />
                </button>
              </form>
            </div>
            <div className="mt-8">
              <Button onClick={() => navigate('petunjuk')} icon={ArrowLeft} variant="secondary">
                Kembali ke Petunjuk
              </Button>
            </div>
          </div>
        </React.Fragment>
      );
    };

    // --- KOMPONEN APLIKASI UTAMA ---
    function App() {
      const [currentPage, setCurrentPage] = useState('judul');
      const [fade, setFade] = useState('opacity-100');
     
      // State Global untuk Data Peserta
      const [namaPeserta, setNamaPeserta] = useState('');
      const [asalSekolah, setAsalSekolah] = useState('');
     
      // State dan Ref untuk Musik
      const [isMusicPlaying, setIsMusicPlaying] = useState(false);
      const audioRef = useRef(null);

      // State untuk Fullscreen
      const [isFullscreen, setIsFullscreen] = useState(false);

      // Sinkronisasi state ketika pengguna menekan 'Esc' untuk keluar fullscreen
      useEffect(() => {
        const handleFullscreenChange = () => {
          setIsFullscreen(!!document.fullscreenElement);
        };
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
      }, []);

      const navigate = (page) => {
        setFade('opacity-0');
        setTimeout(() => {
          setCurrentPage(page);
          setFade('opacity-100');
        }, 300);
      };

      const toggleMusic = () => {
        if (isMusicPlaying) {
          audioRef.current.pause();
        } else {
          audioRef.current.play();
        }
        setIsMusicPlaying(!isMusicPlaying);
      };

      const toggleFullscreen = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            console.log(`Gagal mengaktifkan fullscreen: ${err.message}`);
          });
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      };

      // --- HALAMAN 1: JUDUL ---
      const HalamanJudul = () => (
        <React.Fragment>
          <div
            className="fixed inset-0 z-[-1] bg-cover bg-center bg-no-repeat"
            style={{ backgroundImage: 'url("https://i.imgur.com/etfdKcB.png")' }}
          >
            <div className="absolute inset-0 bg-[#0f172a]/20"></div>
          </div>
          <div className="absolute bottom-8 right-8 md:bottom-16 md:right-16 z-10">
            <Button onClick={() => navigate('penjelasan')} icon={Play} variant="primary" className="text-xl px-10 py-5 shadow-blue-500/50 shadow-xl">
              Mulai
            </Button>
          </div>
        </React.Fragment>
      );

      // --- HALAMAN 2: PENJELASAN JUDUL ---
      const HalamanPenjelasan = () => (
        <React.Fragment>
          <div
            className="fixed inset-0 z-[-1] bg-cover bg-center bg-no-repeat"
            style={{ backgroundImage: 'url("https://i.imgur.com/gnmofNg.png")' }}
          >
            <div className="absolute inset-0 bg-[#0f172a]/20"></div>
          </div>
          <div className="flex flex-col items-center justify-center h-full w-full px-4 md:px-12 relative z-10">
            <div className="flex w-full justify-between pt-4">
              <Button onClick={() => navigate('judul')} icon={ArrowLeft} variant="secondary">
                Kembali
              </Button>
              <Button onClick={() => navigate('detektif')} icon={ArrowRight} variant="primary" className="flex-row-reverse">
                Lanjut
              </Button>
            </div>
          </div>
        </React.Fragment>
      );

      // --- HALAMAN DETEKTIF RUPIAH ---
      const HalamanDetektif = () => (
        <React.Fragment>
          <div
            className="fixed inset-0 z-[-1] bg-cover bg-center bg-no-repeat"
            style={{ backgroundImage: 'url("https://i.imgur.com/1KGhjbS.png")' }}
          >
            <div className="absolute inset-0 bg-[#0f172a]/20"></div>
          </div>
          <div className="flex flex-col items-center justify-between h-full max-w-3xl mx-auto px-4 py-10 relative z-10">
            <div className="flex-grow flex items-center justify-center"></div>
            <div className="flex w-full justify-between pt-4">
              <Button onClick={() => navigate('penjelasan')} icon={ArrowLeft} variant="secondary">
                Kembali
              </Button>
              <Button onClick={() => navigate('petunjuk')} icon={Play} variant="primary" className="flex-row-reverse">
                Mulai
              </Button>
            </div>
          </div>
        </React.Fragment>
      );

      // --- HALAMAN 3: PETUNJUK PENGERJAAN ---
      const HalamanPetunjuk = () => (
        <React.Fragment>
          {/* Background Image Khusus Halaman Petunjuk */}
          <div
            className="fixed inset-0 z-[-1] bg-cover bg-center bg-no-repeat"
            style={{ backgroundImage: 'url("https://i.imgur.com/O68ES0x.png")' }}
          >
            {/* Overlay tipis */}
            <div className="absolute inset-0 bg-[#0f172a]/20"></div>
          </div>

          <div className="flex flex-col items-center justify-between h-full max-w-3xl mx-auto px-4 py-10 relative z-10">
            {/* Area kosong untuk menghilangkan konten sebelumnya */}
            <div className="flex-grow flex items-center justify-center"></div>
           
            <div className="flex w-full justify-between pt-4">
              <Button onClick={() => navigate('detektif')} icon={ArrowLeft} variant="secondary">
                Kembali
              </Button>
              <Button onClick={() => navigate('login')} icon={ArrowRight} variant="accent" className="flex-row-reverse">
                Lanjut
              </Button>
            </div>
          </div>
        </React.Fragment>
      );

      // --- HALAMAN PENGANTAR (SETELAH LOGIN) ---
      const HalamanPengantar = () => (
        <React.Fragment>
          <div
            className="fixed inset-0 z-[-1] bg-cover bg-center bg-no-repeat"
            style={{ backgroundImage: 'url("https://i.imgur.com/keANzDo.png")' }}
          >
            <div className="absolute inset-0 bg-[#0f172a]/20"></div>
          </div>
         
          {/* Wrapper Konten Utama */}
          <div className="flex flex-col items-center justify-between h-full max-w-3xl mx-auto px-4 py-10 relative z-10">
           
            {/* Tombol Nama yang Otomatis Terisi */}
            <div className="absolute top-[35%] left-1/2 transform -translate-x-1/2 w-full flex justify-center px-4">
              <div className="inline-flex items-center justify-center gap-3 bg-gradient-to-r from-blue-600/90 to-purple-600/90 backdrop-blur-md border-2 border-white/40 px-8 py-3 rounded-full shadow-[0_0_20px_rgba(59,130,246,0.5)] transform hover:scale-105 transition-all duration-300 animate-pulse">
                <User size={24} className="text-white" />
                <span className="text-xl md:text-2xl font-extrabold text-white tracking-widest uppercase drop-shadow-md">
                  HALO, {namaPeserta || 'PESERTA'}!
                </span>
              </div>
            </div>

            <div className="flex-grow flex items-center justify-center"></div>
            <div className="flex w-full justify-between pt-4">
              <Button onClick={() => navigate('login')} icon={ArrowLeft} variant="secondary">
                Kembali
              </Button>
              <Button onClick={() => navigate('menu')} icon={ArrowRight} variant="primary" className="flex-row-reverse">
                Lanjut ke Menu
              </Button>
            </div>
          </div>
        </React.Fragment>
      );

      // --- HALAMAN 4: MENU UTAMA ---
      const HalamanMenu = () => {
        // Menu Kuis dan Asesmen telah dipisahkan
        const menus = [
          { id: 'tujuan', title: 'Tujuan Pembelajaran', icon: Target, color: 'from-orange-400 to-red-500' },
          { id: 'materi', title: 'Materi Pembelajaran', icon: BookOpen, color: 'from-blue-400 to-indigo-600' },
          { id: 'kuis', title: 'Kuis', icon: HelpCircle, color: 'from-purple-400 to-pink-600' },
          { id: 'petunjuk-asesmen', title: 'Asesmen', icon: ListOrdered, color: 'from-rose-400 to-red-600' },
          { id: 'referensi', title: 'Referensi', icon: Bookmark, color: 'from-violet-500 to-purple-600' },
          { id: 'profil', title: 'Profil Pengembang', icon: User, color: 'from-teal-400 to-emerald-600' }
        ];

        return (
          <React.Fragment>
            <div
              className="fixed inset-0 z-[-1] bg-cover bg-center bg-no-repeat"
              style={{ backgroundImage: 'url("https://i.imgur.com/fgsyGw4.png")' }}
            >
              <div className="absolute inset-0 bg-[#0f172a]/20"></div>
            </div>
            <div className="flex flex-col items-start justify-center h-full max-w-6xl mx-auto px-6 md:px-12 lg:px-20 w-full relative z-10">
              <h2 className="text-4xl font-bold text-white mb-8 drop-shadow-md text-left">Menu Utama</h2>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-2xl">
                {menus.map((menu) => (
                  <button
                    key={menu.id}
                    onClick={() => navigate(menu.id)}
                    className={`relative overflow-hidden rounded-3xl p-6 shadow-xl transition-all duration-300 transform hover:-translate-y-2 hover:shadow-2xl group text-left h-36 flex flex-col justify-end bg-gradient-to-br ${menu.color}`}
                  >
                    <div className="absolute top-4 right-4 opacity-50 group-hover:opacity-100 transition-opacity duration-300 transform group-hover:scale-110">
                      <menu.icon size={48} color="white" />
                    </div>
                    <h3 className="text-xl font-bold text-white relative z-10">{menu.title}</h3>
                  </button>
                ))}
              </div>
              <div className="mt-8 w-full max-w-2xl flex justify-start">
                <Button onClick={() => navigate('pengantar')} icon={ArrowLeft} variant="secondary">
                  Kembali
                </Button>
              </div>
            </div>
          </React.Fragment>
        );
      };

      // --- SUB-HALAMAN: TUJUAN PEMBELAJARAN ---
      const HalamanTujuan = () => (
        <React.Fragment>
          <div
            className="fixed inset-0 z-[-1] bg-cover bg-center bg-no-repeat"
            style={{ backgroundImage: 'url("https://i.imgur.com/JwZXDzM.png")' }}
          >
            <div className="absolute inset-0 bg-[#0f172a]/20"></div>
          </div>
          <div className="flex flex-col w-full max-w-xl mx-auto h-full p-4 justify-center relative z-10">
            <div className="bg-[#0f172a]/70 backdrop-blur-md border border-white/10 p-8 md:p-10 rounded-3xl shadow-[0_0_30px_rgba(0,0,0,0.5)] w-full">
              <div className="flex items-center gap-4 mb-8 border-b border-white/20 pb-4">
                <Target size={40} className="text-orange-400 drop-shadow-md" />
                <h2 className="text-3xl md:text-4xl font-bold text-white drop-shadow-lg">Tujuan Pembelajaran</h2>
              </div>
              <div className="space-y-6 text-lg text-white">
                <p className="font-medium drop-shadow text-base md:text-xl">Setelah menggunakan media pembelajaran interaktif ini, pengguna diharapkan mampu:</p>
                <ul className="list-decimal list-inside space-y-4 bg-black/40 border border-white/5 p-6 md:p-8 rounded-xl shadow-inner text-base md:text-lg">
                  <li className="leading-relaxed drop-shadow-sm">Mendeskripsikan kondisi ekonomi Indonesia pada awal kemerdekaan</li>
                  <li className="leading-relaxed drop-shadow-sm">Mendeskripsikan kebijakan ekonomi Indonesia pada awal kemerdekaan, Oeang Repoeblik Indonesia (ORI): Sejarah Lahirnya Identitas Rupiah</li>
                </ul>
              </div>
            </div>
          </div>
        </React.Fragment>
      );

      // --- SUB-HALAMAN: RINCIAN MATERI (MENU MATERI) ---
      const HalamanSubMenuMateri = () => {
        const subMenus = [
          { id: 'isi-materi-1', title: 'Mendeskripsikan kondisi ekonomi Indonesia pada awal kemerdekaan', icon: BookOpen, color: 'from-blue-500 to-cyan-600' },
          { id: 'isi-materi-2', title: 'Mendeskripsikan kebijakan ekonomi Indonesia pada awal kemerdekaan, Oeang Repoeblik Indonesia (ORI): Sejarah Lahirnya Identitas Rupiah', icon: LayoutGrid, color: 'from-emerald-500 to-teal-600' }
        ];

        return (
          <React.Fragment>
            <div
              className="fixed inset-0 z-[-1] bg-cover bg-center bg-no-repeat"
              style={{ backgroundImage: 'url("https://i.imgur.com/MblF3u1.png")' }}
            >
              <div className="absolute inset-0 bg-[#0f172a]/20"></div>
            </div>
            <div className="flex flex-col items-end justify-center h-full max-w-6xl mx-auto px-6 md:px-12 lg:px-20 w-full relative z-10">
              <div className="w-full max-w-xl xl:max-w-2xl flex flex-col">
                <div className="flex items-center gap-4 mb-10 border-b border-white/20 pb-4 w-full justify-start">
                  <BookOpen size={40} className="text-blue-400" />
                  <h2 className="text-4xl font-bold text-white drop-shadow-md text-left">Rincian Materi</h2>
                </div>
               
                <div className="grid grid-cols-1 gap-5 w-full">
                  {subMenus.map((menu) => (
                    <button
                      key={menu.id}
                      onClick={() => navigate(menu.id)} // Mengarah langsung ke ID materi masing-masing
                      className={`relative overflow-hidden rounded-2xl p-6 shadow-lg transition-all duration-300 transform hover:-translate-y-1 hover:shadow-xl group text-left flex items-center gap-6 bg-gradient-to-r ${menu.color}`}
                    >
                      <div className="bg-white/20 p-4 rounded-full group-hover:scale-110 transition-transform duration-300">

                      </div>
                      <div className="flex-grow">
                        <h3 className="text-lg md:text-xl font-bold text-white relative z-10 leading-snug">{menu.title}</h3>
                      </div>
                      <div className="opacity-70 group-hover:opacity-100 transition-opacity duration-300">
                        <ArrowRight size={28} color="white" />
                      </div>
                    </button>
                  ))}
                </div>
                <div className="mt-12 w-full flex justify-start">
                  <Button onClick={() => navigate('menu')} icon={ArrowLeft} variant="secondary">
                    Kembali ke Menu
                  </Button>
                </div>
              </div>
            </div>
          </React.Fragment>
        );
      };

      // --- SUB-HALAMAN: MATERI DRIVE (GOOGLE DRIVE EMBED) ---
      const HalamanMateriDrive1 = () => {
        return (
          <React.Fragment>
            {/* Menggunakan overlay dengan efek blur estetis alih-alih warna solid */}
            <div className="fixed inset-0 z-[100] flex flex-col bg-[#0f172a]/60 backdrop-blur-xl">
              
              {/* Header Khusus dibuat transparan (glassmorphism) */}

          />

          <div className="fixed inset-0 z-0 overflow-hidden pointer-events-none">
            <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-blue-600/20 blur-[120px]"></div>
            <div className="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-purple-600/20 blur-[120px]"></div>
            <div className="absolute top-[40%] left-[60%] w-[30%] h-[30%] rounded-full bg-pink-600/10 blur-[100px]"></div>
          </div>

          <div className={`relative z-10 w-full min-h-screen transition-opacity duration-300 ease-in-out ${fade} pb-8`}>
           
            {/* Header dibuat lebih transparan (opacity diturunkan) di halaman selain judul */}
            <header className={`py-2 px-4 sticky top-0 z-50 transition-all duration-300 ${currentPage === 'judul' ? 'bg-transparent' : 'bg-[#0f172a]/10 border-b border-white/5 backdrop-blur-sm'}`}>
              <div className={`max-w-6xl mx-auto flex items-center ${currentPage === 'judul' ? 'justify-end' : 'justify-between'}`}>
               
                {/* Kiri: Judul M-Learning HANYA tampil jika bukan di Halaman Judul */}
                {currentPage !== 'judul' && (
                  <div className="flex items-center gap-2 text-white/80">
                    <BookOpen size={18} className="text-blue-400"/>
                    <span className="font-bold tracking-wider uppercase text-xs md:text-sm">M-LEARNING PERISAI</span>
                  </div>
                )}
               
                {/* Kanan: Navigasi dan Kontrol Musik/Fullscreen */}
                <div className="flex items-center gap-3 sm:gap-4">
                  {currentPage !== 'menu' && currentPage !== 'penjelasan' && currentPage !== 'detektif' && currentPage !== 'petunjuk' && currentPage !== 'login' && currentPage !== 'pengantar' && currentPage !== 'judul' && (
                    <button
                      onClick={() => navigate('menu')}
                      className="bg-black/40 p-1.5 rounded-full text-white hover:bg-black/60 transition-all hover:scale-110 active:scale-95"
                      title="Ke Menu"
                    >
                      <Home size={18} className="text-indigo-300" />
                    </button>
                  )}
                 
                  {/* Grup Tombol Kontrol */}
                  <div className="flex gap-2 items-center">
                    <button
                      onClick={toggleMusic}
                      className="bg-black/40 p-1.5 rounded-full text-white hover:bg-black/60 transition-all hover:scale-110 active:scale-95"
                      title={isMusicPlaying ? "Matikan Musik" : "Nyalakan Musik"}
                    >
                      {isMusicPlaying ? <Volume2 size={18} className="text-blue-400" /> : <VolumeX size={18} className="text-gray-400" />}
                    </button>
                   
                    <button
                      onClick={toggleFullscreen}
                      className="bg-black/40 p-1.5 rounded-full text-white hover:bg-black/60 transition-all hover:scale-110 active:scale-95"
                      title={isFullscreen ? "Keluar Layar Penuh" : "Layar Penuh"}
                    >
                      {isFullscreen ? <Minimize size={18} className="text-emerald-300" /> : <Maximize size={18} className="text-indigo-300" />}
                    </button>
                  </div>
                </div>

              </div>
            </header>

            <main className="max-w-6xl mx-auto h-[calc(100vh-60px)] pt-4">
              {renderPage()}
            </main>
          </div>
        </div>
      );
    }

    // Melakukan render aplikasi React ke dalam div #root di HTML
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
